services:
  backend:
    build:
      context: ./backend
    environment:
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
  frontend:
    build:
      context: ./frontend
    environment:
      - VITE_API_BASE_URL=/api
    ports:
      - "5173:80"
    depends_on:
      - backend
